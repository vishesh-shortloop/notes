apiVersion: v1
kind: Service
metadata:
  name: notes-redis
  labels: {{- include "notes.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: { app: notes-redis }
  ports: [{ name: redis, port: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: notes-redis
  labels: {{- include "notes.labels" . | nindent 4 }}
spec:
  serviceName: notes-redis
  replicas: 1
  selector:
    matchLabels: { app: notes-redis }
  template:
    metadata:
      labels: { app: notes-redis }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["--appendonly", "yes", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: redis-password } }
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe:
            exec: { command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"] }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: redis }
            initialDelaySeconds: 10
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext: {{- include "notes.podSecurity" . | nindent 12 }}
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ .Values.redis.storage }} } }

apiVersion: v1
kind: ConfigMap
metadata:
  name: notes
  labels: {{- include "notes.labels" . | nindent 4 }}
data:
  REDIS_HOST: notes-redis
  LOG_LEVEL: {{ .Values.logLevel | quote }}
  OTEL_SERVICE_NAME: notes-api
  OTEL_PYTHON_FLASK_EXCLUDED_URLS: "healthz,readyz,metrics"
  OTEL_TRACES_EXPORTER: {{ ternary "otlp" "none" .Values.tracing.enabled | quote }}
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.tracing.endpoint | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

# kube-prometheus-stack, trimmed for a local kind cluster.
alertmanager:
  enabled: true
grafana:
  adminPassword: ""  # random; read it with `make grafana-password`
  sidecar:
    dashboards:
      searchNamespace: ALL
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 2d
nodeExporter:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
